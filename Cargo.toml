[workspace]
resolver = "3"
members = ["crates/*", "apps/laserline-desktop"]
default-members = ["crates/laserline-core", "apps/laserline-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Jonas Ahlf <javerik@javerik.space>"]
repository = "https://git.javerik.dev/opensource/laserthing"
homepage = "https://git.javerik.dev/opensource/laserthing"

[workspace.dependencies]
laserline-core = { path = "crates/laserline-core", version = "0.1.0" }
laserline-render = { path = "crates/laserline-render", version = "0.1.0" }
laserline-egui = { path = "crates/laserline-egui", version = "0.1.0" }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Model file formats (laserline-core::formats).
base64 = "0.22.1"
miniz_oxide = "0.9.1"
quick-xml = { version = "0.41.0", default-features = false }
truck-meshalgo = { version = "0.4.0", default-features = false, features = ["tessellation"] }
truck-modeling = "0.6.0"
truck-stepio = "0.3.0"
eframe = "0.33.3"
egui = { version = "0.33.3", default-features = false }
egui-wgpu = { version = "0.33.3", default-features = false }
rfd = "0.17.2"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
# Must equal the wasm-bindgen-cli version used by scripts/build-wasm.sh.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
# Same major version as eframe's egui-wgpu, so the renderers plug into its callbacks.
wgpu = { version = "27.0.1", default-features = false, features = ["std", "wgsl"] }

# Size-optimised release build of the wasm bindings (scripts/build-wasm.sh).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
