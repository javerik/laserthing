[package]
name = "laserline-desktop"
description = "Native laser line emulator with STL slicer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "laserline"
path = "src/main.rs"

[dependencies]
laserline-egui.workspace = true
# STEP import (tessellated with truck).
laserline-core = { workspace = true, features = ["step"] }
eframe = { workspace = true, features = ["wgpu", "persistence"] }
rfd.workspace = true
serde.workspace = true
